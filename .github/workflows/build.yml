name: build-book

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install notebook smoke-test runtime
        run: pip install nbconvert ipykernel
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-lang-french latexmk
      - run: make test
      - name: Execute wave notebooks end to end
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
        run: |
          set -euo pipefail
          for nb in \
            notebooks/waves/00_wave_equation_toy_lab.ipynb \
            notebooks/waves/01_von_neumann_cfl_lab.ipynb
          do
            base="$(basename "$nb" .ipynb)"
            jupyter nbconvert \
              --to notebook \
              --execute "$nb" \
              --output "${base}.executed.ipynb" \
              --output-dir /tmp \
              --ExecutePreprocessor.timeout=600
          done
      - run: make book
      - uses: actions/upload-artifact@v4
        with:
          name: diderot-ml-book
          path: output/pdf/*.pdf
