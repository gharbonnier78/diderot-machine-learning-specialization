name: build-book

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install notebook smoke-test runtime
        run: pip install nbconvert ipykernel
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-lang-french latexmk
      - run: make test
      - name: Execute wave-equation notebook end to end
        env:
          MPLBACKEND: Agg
          PYTHONPATH: src
        run: >-
          jupyter nbconvert
          --to notebook
          --execute notebooks/waves/00_wave_equation_toy_lab.ipynb
          --output wave-equation-toy-lab.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=600
      - run: make book
      - uses: actions/upload-artifact@v4
        with:
          name: diderot-ml-book
          path: output/pdf/*.pdf
