  - {source: identity_db, target: observability, mechanism: resource, probability: 0.62}
  - {source: session_cache, target: observability, mechanism: resource, probability: 0.60}
  - {source: event_bus, target: auth_service, mechanism: resource, probability: 0.45, visible: false}
  - {source: supplier_sdk, target: capture_device, mechanism: timing, probability: 0.36, visible: false}
  - {source: feature_store, target: risk_engine, mechanism: data, probability: 0.72, visible: false}

changes:
  - id: CHG_CACHE_TTL
    target: session_cache
    category: config
    magnitude: 0.95
    description: Increase session-cache TTL; functional retest may pass while stale authorization state propagates.
  - id: CHG_IDENTITY_EVENT_V2
    target: identity_service
    category: schema
    magnitude: 0.90
    description: Evolve identity event payload and serialization.
  - id: CHG_EVENTBUS_POOL
    target: event_bus
    category: resource
    magnitude: 0.92
    description: Change event-bus connection/thread-pool sizing under load.
  - id: CHG_SUPPLIER_SDK
    target: supplier_sdk
    category: supplier
    magnitude: 0.95
    description: Upgrade a device supplier SDK with unchanged public adapter API.

tests:
  - {id: T_UNIT_IDENTITY, covers: [identity_service], detects: {functional: 0.92, schema_mismatch: 0.50, stale_state: 0.20}, cost: 1, historical_relevance: {schema: 0.70, config: 0.20, resource: 0.05, supplier: 0.00}}
  - {id: T_API_ENROLL, covers: [citizen_app, api_gateway, enrollment_service, identity_service], detects: {functional: 0.88, schema_mismatch: 0.62, timeout: 0.55}, cost: 3, historical_relevance: {schema: 0.65, config: 0.20, resource: 0.30, supplier: 0.15}}
  - {id: T_AUTH_FLOW, covers: [citizen_app, api_gateway, auth_service, identity_service, session_cache, policy_service], detects: {functional: 0.90, stale_state: 0.78, authorization: 0.87, timeout: 0.62}, cost: 3, historical_relevance: {schema: 0.25, config: 0.80, resource: 0.50, supplier: 0.00}}
  - {id: T_CACHE_CONCURRENCY, covers: [session_cache, auth_service, identity_service], detects: {stale_state: 0.96, race: 0.92, timeout: 0.52, latency: 0.45}, cost: 5, historical_relevance: {schema: 0.10, config: 0.95, resource: 0.65, supplier: 0.00}}
  - {id: T_SCHEMA_CONTRACT, covers: [identity_service, event_bus, risk_engine, audit_db], detects: {schema_mismatch: 0.97, functional: 0.45}, cost: 2, historical_relevance: {schema: 0.98, config: 0.05, resource: 0.10, supplier: 0.00}}
  - {id: T_EVENT_REPLAY, covers: [event_bus, risk_engine, audit_db, observability], detects: {schema_mismatch: 0.82, availability: 0.62, latency: 0.50, functional: 0.40}, cost: 4, historical_relevance: {schema: 0.75, config: 0.05, resource: 0.75, supplier: 0.00}}
  - {id: T_LOAD_AUTH, covers: [api_gateway, auth_service, session_cache, identity_db, event_bus, observability], detects: {latency: 0.92, timeout: 0.88, stale_state: 0.42, availability: 0.60}, cost: 8, historical_relevance: {schema: 0.10, config: 0.60, resource: 0.95, supplier: 0.00}}
  - {id: T_FAILOVER, covers: [api_gateway, event_bus, identity_db, session_cache, policy_service], detects: {availability: 0.92, timeout: 0.72, stale_state: 0.35}, cost: 10, historical_relevance: {schema: 0.05, config: 0.25, resource: 0.85, supplier: 0.00}}
  - {id: T_SECURITY_POLICY, covers: [auth_service, policy_service, kms], detects: {authorization: 0.97, availability: 0.40, functional: 0.45}, cost: 6, historical_relevance: {schema: 0.05, config: 0.55, resource: 0.10, supplier: 0.00}}
  - {id: T_BIO_E2E, covers: [citizen_app, api_gateway, enrollment_service, biometric_service, device_adapter, supplier_sdk, capture_device], detects: {functional: 0.82, compatibility: 0.84, acquisition: 0.92, timeout: 0.58, model_shift: 0.32}, cost: 7, historical_relevance: {schema: 0.05, config: 0.25, resource: 0.20, supplier: 0.90}}
  - {id: T_SUPPLIER_COMPAT, covers: [supplier_sdk, device_adapter, biometric_service, capture_device], detects: {compatibility: 0.97, functional: 0.68, acquisition: 0.72, timeout: 0.30}, cost: 4, historical_relevance: {schema: 0.00, config: 0.05, resource: 0.05, supplier: 0.99}}
  - {id: T_ML_SHIFT, covers: [feature_store, ml_model, biometric_service, risk_engine], detects: {data_shift: 0.84, model_shift: 0.88, functional: 0.30}, cost: 6, historical_relevance: {schema: 0.05, config: 0.10, resource: 0.05, supplier: 0.15}}
  - {id: T_CONFIG_MATRIX, covers: [config_service, auth_service, identity_service, biometric_service, session_cache], detects: {misconfiguration: 0.92, functional: 0.55, stale_state: 0.35}, cost: 5, historical_relevance: {schema: 0.10, config: 0.97, resource: 0.15, supplier: 0.05}}
  - {id: T_DEVICE_SYNC, covers: [capture_device, device_adapter, biometric_service], detects: {acquisition: 0.84, race: 0.78, timeout: 0.46, compatibility: 0.55}, cost: 5, historical_relevance: {schema: 0.00, config: 0.05, resource: 0.10, supplier: 0.78}}
  - {id: T_SMOKE, covers: [api_gateway, enrollment_service, auth_service, identity_service, biometric_service], detects: {functional: 0.58, timeout: 0.22}, cost: 2, historical_relevance: {schema: 0.35, config: 0.35, resource: 0.35, supplier: 0.25}}
  - {id: T_TELEMETRY_ASSERTIONS, covers: [observability, api_gateway, auth_service, event_bus, identity_db, session_cache], detects: {latency: 0.76, timeout: 0.68, availability: 0.52, stale_state: 0.18}, cost: 3, historical_relevance: {schema: 0.10, config: 0.30, resource: 0.88, supplier: 0.00}}
