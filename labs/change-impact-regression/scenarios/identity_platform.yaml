name: identity-platform-v0
metadata:
  domain: synthetic distributed identity platform
  purpose: change-impact and regression-evidence experimentation
  note: The graph is synthetic and does not represent any production IN Groupe architecture.

nodes:
  - {id: citizen_app, kind: ui, criticality: 2, zone: edge, tags: [enrollment, auth], failure_modes: [functional, timeout]}
  - {id: api_gateway, kind: gateway, criticality: 4, zone: dmz, tags: [enrollment, auth, timing], failure_modes: [functional, timeout, availability]}
  - {id: enrollment_service, kind: service, criticality: 4, zone: core, tags: [enrollment], failure_modes: [functional, timeout]}
  - {id: identity_service, kind: service, criticality: 5, zone: core, tags: [identity, schema, state], failure_modes: [functional, schema_mismatch, stale_state]}
  - {id: auth_service, kind: service, criticality: 5, zone: core, tags: [auth, security, state, timing], failure_modes: [functional, stale_state, authorization, timeout]}
  - {id: biometric_service, kind: service, criticality: 5, zone: core, tags: [biometric, device, ml], failure_modes: [functional, acquisition, model_shift]}
  - {id: risk_engine, kind: service, criticality: 5, zone: core, tags: [risk, ml, data], failure_modes: [functional, data_shift, model_shift]}
  - {id: event_bus, kind: messaging, criticality: 4, zone: platform, tags: [schema, resource, timing], failure_modes: [schema_mismatch, latency, availability]}
  - {id: identity_db, kind: database, criticality: 5, zone: data, tags: [identity, state, resource], failure_modes: [stale_state, latency, availability]}
  - {id: audit_db, kind: database, criticality: 4, zone: data, tags: [audit, schema], failure_modes: [schema_mismatch, availability]}
  - {id: session_cache, kind: cache, criticality: 5, zone: platform, tags: [auth, state, config, resource], failure_modes: [stale_state, latency, race]}
  - {id: config_service, kind: configuration, criticality: 4, zone: platform, tags: [config], failure_modes: [misconfiguration]}
  - {id: policy_service, kind: policy, criticality: 5, zone: security, tags: [auth, security], failure_modes: [authorization, availability]}
  - {id: kms, kind: security, criticality: 5, zone: security, tags: [auth, security], failure_modes: [authorization, availability]}
  - {id: device_adapter, kind: adapter, criticality: 4, zone: device, tags: [biometric, device, supplier], failure_modes: [functional, compatibility, acquisition]}
  - {id: capture_device, kind: device, criticality: 5, zone: device, tags: [biometric, device, sensor], failure_modes: [acquisition, timeout]}
  - {id: supplier_sdk, kind: library, criticality: 4, zone: device, tags: [biometric, supplier], failure_modes: [compatibility, functional]}
  - {id: ml_model, kind: model, criticality: 4, zone: ml, tags: [ml, biometric, data], failure_modes: [model_shift, data_shift]}
  - {id: feature_store, kind: data, criticality: 4, zone: ml, tags: [ml, data], failure_modes: [data_shift, availability]}
  - {id: observability, kind: telemetry, criticality: 3, zone: platform, tags: [timing, audit], failure_modes: [functional]}

