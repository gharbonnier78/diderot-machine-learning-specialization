  - {source: identity_db, target: identity_service, mechanism: state, probability: 0.75}
  - {source: identity_service, target: session_cache, mechanism: state, probability: 0.90}
  - {source: session_cache, target: auth_service, mechanism: state, probability: 0.92}
  - {source: identity_service, target: event_bus, mechanism: message, probability: 0.82}
  - {source: event_bus, target: risk_engine, mechanism: message, probability: 0.88}
  - {source: event_bus, target: audit_db, mechanism: message, probability: 0.86}
  - {source: risk_engine, target: policy_service, mechanism: control, probability: 0.74}
  - {source: policy_service, target: auth_service, mechanism: security, probability: 0.88}
  - {source: kms, target: auth_service, mechanism: security, probability: 0.70}
  - {source: auth_service, target: api_gateway, mechanism: timing, probability: 0.72}
  - {source: enrollment_service, target: api_gateway, mechanism: timing, probability: 0.68}
  - {source: biometric_service, target: enrollment_service, mechanism: timing, probability: 0.72}
  - {source: supplier_sdk, target: device_adapter, mechanism: supplier, probability: 0.92}
  - {source: capture_device, target: device_adapter, mechanism: sensor, probability: 0.88}
  - {source: device_adapter, target: biometric_service, mechanism: device, probability: 0.90}
  - {source: feature_store, target: ml_model, mechanism: data, probability: 0.82}
  - {source: ml_model, target: biometric_service, mechanism: ml, probability: 0.78}
  - {source: ml_model, target: risk_engine, mechanism: ml, probability: 0.64}
  - {source: config_service, target: auth_service, mechanism: configuration, probability: 0.88}
  - {source: config_service, target: identity_service, mechanism: configuration, probability: 0.86}
  - {source: config_service, target: biometric_service, mechanism: configuration, probability: 0.78}
