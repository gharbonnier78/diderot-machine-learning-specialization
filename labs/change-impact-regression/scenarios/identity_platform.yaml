  - {source: api_gateway, target: enrollment_service, mechanism: call, probability: 0.95}
  - {source: api_gateway, target: auth_service, mechanism: call, probability: 0.95}
  - {source: enrollment_service, target: identity_service, mechanism: call, probability: 0.92}
  - {source: enrollment_service, target: biometric_service, mechanism: call, probability: 0.90}
